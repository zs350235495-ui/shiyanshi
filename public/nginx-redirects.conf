# ==============================================================================
# Nginx 301 推广返佣链接隔离与安全重定向配置文件
# 适用于: VPS 纯 Nginx、宝塔面板 (BT-Panel)、1Panel、lnmp 等
# 使用方法: 在 Nginx 虚拟主机配置 server { ... } 块内添加:
#          include /www/server/nginx/conf/nginx-redirects.conf;
#          或者直接复制本文件全部内容至站点配置文件内。
# ==============================================================================

