    body {

      align-items: center;
      justify-content: center;
      padding: 20px;

      position: relative;

    /* 动态光晕背景 */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
      animation: pulse 4s ease-in-out infinite alternate;
      z-index: 1;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.1); opacity: 0.9; }
    }
    .card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.1);
    }
    .radar-spinner {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
    }
    .radar-spinner::before, .radar-spinner::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .radar-spinner::before {
      border-top-color: var(--primary);
      border-right-color: var(--primary);
      animation: spin 1s linear infinite;
    }
    .radar-spinner::after {
      border-bottom-color: var(--accent);
      border-left-color: var(--accent);
      animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite reverse;
    }
    .radar-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {

      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;

    .badge-bar {

      background: rgba(56, 189, 248, 0.08);

      border-radius: 9999px;
      font-size: 12px;
      color: #38bdf8;

    .btn {

      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);

    .btn:hover {
