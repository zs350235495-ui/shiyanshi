name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 必须声明的核心权限：读取源码、写入 Pages 部署、生成 OIDC ID 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 保证同一时间只有一个 Pages 部署任务在执行，避免并发冲突
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 任务 1：静态打包构建与上传
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site with Astro
        run: npm run build

      - name: Submit URLs to IndexNow API (Optional)
        run: node scripts/submit-indexnow.cjs
        continue-on-error: true

      - name: Upload static artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # 任务 2：执行 GitHub Pages 正式部署
  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
